name: 部署管理后台 (mgr.ylglxt.cn)

on:
  workflow_dispatch: # 仅在 GitHub 网页端手动点击 "Run workflow" 按钮时触发部署

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 安装 pnpm 环境
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: 3. 设置 Node.js 环境并开启依赖缓存
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: 4. 安装依赖并构建管理后台
        run: |
          pnpm install --no-frozen-lockfile
          ROLLUP_SKIP_NODE_NATIVE_DEPENDENCY=true pnpm run build:antd

      - name: 5. 打包构建产物
        run: |
          tar -czvf dist.tar.gz -C apps/web-antd/dist .

      - name: 6. 上传构建包到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: 'dist.tar.gz'
          target: '/www/wwwroot/mgr.ylglxt.cn/'

      - name: 7. 远程解压与生效
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /www/wwwroot/mgr.ylglxt.cn/
            tar -zxvf dist.tar.gz && rm -f dist.tar.gz
            echo "✅ 管理后台前端部署成功！"
